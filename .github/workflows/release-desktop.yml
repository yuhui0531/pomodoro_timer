name: Release Desktop Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag to publish, for example v1.0.1
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-latest
            artifact_name: macos-arm64
            package_cmd: npx electron-builder --mac dmg --arm64 --publish never
            artifact_paths: |
              dist/*.dmg
              dist/*.dmg.blockmap
          - label: macOS x64
            runner: macos-15-intel
            artifact_name: macos-x64
            package_cmd: npx electron-builder --mac dmg --x64 --publish never
            artifact_paths: |
              dist/*.dmg
              dist/*.dmg.blockmap
          - label: Windows x64
            runner: windows-latest
            artifact_name: windows-x64
            package_cmd: npx electron-builder --win nsis --x64 --publish never
            artifact_paths: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest*.yml
          - label: Linux x64
            runner: ubuntu-latest
            artifact_name: linux-x64
            package_cmd: npx electron-builder --linux AppImage --x64 --publish never
            artifact_paths: |
              dist/*.AppImage
              dist/*.AppImage.blockmap
              dist/latest-linux*.yml

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version

      - name: Build app bundles
        run: npm run build

      - name: Package app
        run: ${{ matrix.package_cmd }}

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-arm64
          path: release-assets

      - name: Download macOS x64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: macos-x64
          path: release-assets

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: windows-x64
          path: release-assets

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@v5
        with:
          name: linux-x64
          path: release-assets

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || \
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" release-assets/* --clobber
