name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.arch }} DMG
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            artifact_name: dmg-arm64
          - arch: x64
            runner: macos-15-intel
            artifact_name: dmg-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app bundles
        run: npm run build

      - name: Build arm64 DMG
        if: matrix.arch == 'arm64'
        run: npx electron-builder --mac dmg --arm64

      - name: Build x64 DMG
        if: matrix.arch == 'x64'
        run: npx electron-builder --mac dmg --x64

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build-macos

    steps:
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: release-assets

      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmg-x64
          path: release-assets

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
